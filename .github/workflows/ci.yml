name: ci
on: [push,pull_request]
jobs:
  test:
    name: Node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Screenshot baselines exist for darwin only; the suite is deterministic
      # there (see test/setup.js).
      - run: npm run test-integration
        if: matrix.os == 'macos-15'
